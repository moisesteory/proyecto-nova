name: Build Separador de Música V1

on:
  push:
    branches:
      - separador-musica-v1-build
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: separador-musica-v1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: separador-musica-v1/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Build EXE
        run: pyinstaller --clean --noconfirm SeparadorMusica.spec

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: SeparadorMusicaV1-Windows
          path: separador-musica-v1/dist/SeparadorMusica.exe
          if-no-files-found: error
          retention-days: 14
